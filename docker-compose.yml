services:
  web:
    build: .
    container_name: snake-os-lite
    restart: unless-stopped
    ports:
      - "8990:8000"
    volumes:
      - .:/app
      - snakeos-lite-data:/app/data
      # Misma base de usuarios que Snake OS VP (solo lectura)
      - snake-os-vp_snakeos-vp-data:/app/vp-data:ro
    environment:
      - PYTHONUNBUFFERED=1
      - SNAKEOS_VP_DB=/app/vp-data/snakeos.db
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: snake-os-lite-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - web
volumes:
  snakeos-lite-data:
  snake-os-vp_snakeos-vp-data:
    external: true
